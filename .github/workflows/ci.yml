name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Pyright selects platform-specific stdlib stubs from the host OS. The
      # runtime deliberately contains guarded POSIX session-attach and secure
      # descriptor paths, so type-check once against the supported POSIX API;
      # the Windows lane still executes the full test and build gates below.
      - if: matrix.os != 'windows-latest'
        run: uv run pyright src tests
      - run: uv run pytest -q
      - run: uv build

  source-install-smoke:
    name: source install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Install and verify the checked-out commit
        env:
          AMPLIFIER_RUNTIME_REPO_URL: file://${{ github.workspace }}
          AMPLIFIER_RUNTIME_UPDATE_SHELL: "0"
        run: |
          sh -n scripts/install.sh
          bash -n scripts/install.sh
          sh scripts/install.sh --ref "$GITHUB_SHA" --no-update-shell
          "$(uv tool dir --bin)/amplifier-runtime" --version
          "$(uv tool dir --bin)/amplifier-runtime" serve --help >/dev/null

  source-install-smoke-windows:
    name: source install (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Parse and install the checked-out commit
        shell: pwsh
        env:
          AMPLIFIER_RUNTIME_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
          AMPLIFIER_RUNTIME_INSTALL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          & scripts/install.ps1 -Ref $env:AMPLIFIER_RUNTIME_INSTALL_REF -NoUpdateShell
          & (Join-Path (& uv tool dir --bin).Trim() "amplifier-runtime.exe") --version
